<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Místico</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0620;
            font-family: 'Raleway', sans-serif;
            color: white;
            cursor: none; /* Ocultamos el cursor normal */
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Cursor personalizado */
        #cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #e0aaff, #9b59b6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #c77dff, 0 0 24px #9b59b6;
            transition: transform 0.08s ease;
        }

        .content {
            position: fixed;
            z-index: 10;
            width: 100%;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8vh;
            pointer-events: none;
        }

        .subtitle {
            font-family: 'Raleway', sans-serif;
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #c77dff;
            margin-bottom: 14px;
            opacity: 0.85;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 3.5vw, 2.6rem);
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(135deg, #e0aaff, #ffffff, #c77dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 18px rgba(199, 125, 255, 0.5));
            animation: floatTitle 5s ease-in-out infinite;
            line-height: 1.4;
        }

        .divider {
            margin-top: 18px;
            width: 120px;
            height: 1px;
            background: linear-gradient(to right, transparent, #c77dff, transparent);
            opacity: 0.7;
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div id="cursor"></div>

    <div class="content">
        <p class="subtitle">✦ Portal de los Arcanos ✦</p>
        <h1>"El universo habla a través de las cartas,<br>escucha lo que tu alma ya sabe"</h1>
        <div class="divider"></div>
    </div>

    <script>
        // ── Canvas & contexto ──────────────────────────────────────────
        const canvas = document.getElementById('canvas');
        const ctx    = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');

        let W, H, stars = [], particles = [];
        let mouse = { x: -200, y: -200 };

        // ── Resize ────────────────────────────────────────────────────
        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            initStars();
        }

        // ── Estrellas ─────────────────────────────────────────────────
        function initStars() {
            stars = [];
            const n = Math.floor(W * H / 1800);
            for (let i = 0; i < n; i++) {
                stars.push({
                    x:     Math.random() * W,
                    y:     Math.random() * H,
                    r:     Math.random() * 1.3 + 0.2,
                    alpha: Math.random(),
                    da:    (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1)
                });
            }
        }

        function drawStars() {
            stars.forEach(s => {
                s.alpha += s.da;
                if (s.alpha >= 1 || s.alpha <= 0) s.da = -s.da;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${Math.abs(s.alpha)})`;
                ctx.fill();
            });
        }

        // ── Partículas de estela ───────────────────────────────────────
        class Particle {
            constructor(x, y) {
                this.x     = x;
                this.y     = y;
                this.r     = Math.random() * 3 + 1;
                this.alpha = 0.9;
                this.vx    = (Math.random() - 0.5) * 0.6;
                this.vy    = (Math.random() - 0.5) * 0.6 - 0.4;
                // Colores mágicos: morado, violeta, dorado suave
                const palette = [
                    `rgba(224,170,255,`,
                    `rgba(199,125,255,`,
                    `rgba(155, 89,182,`,
                    `rgba(255,215,180,`,
                    `rgba(255,255,255,`
                ];
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }
            update() {
                this.x     += this.vx;
                this.y     += this.vy;
                this.alpha -= 0.045;
                this.r     *= 0.97;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.alpha + ')';
                ctx.shadowBlur  = 8;
                ctx.shadowColor = '#c77dff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            get dead() { return this.alpha <= 0 || this.r < 0.3; }
        }

        // ── Bucle de animación ─────────────────────────────────────────
        function animate() {
            ctx.clearRect(0, 0, W, H);

            drawStars();

            // Partículas
            particles = particles.filter(p => !p.dead);
            particles.forEach(p => { p.update(); p.draw(); });

            requestAnimationFrame(animate);
        }

        // ── Eventos ───────────────────────────────────────────────────
        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            // Mover cursor personalizado
            cursor.style.left = mouse.x + 'px';
            cursor.style.top  = mouse.y + 'px';

            // Añadir 2-3 partículas por movimiento (estela corta y suave)
            const count = Math.floor(Math.random() * 2) + 1;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(mouse.x, mouse.y));
            }
            // Límite máximo para no sobrecargar
            if (particles.length > 120) particles.splice(0, particles.length - 120);
        });

        window.addEventListener('touchmove', e => {
            const t = e.touches[0];
            mouse.x = t.clientX;
            mouse.y = t.clientY;
            particles.push(new Particle(mouse.x, mouse.y));
        });

        resize();
        animate();
    </script>
</body>
</html>
